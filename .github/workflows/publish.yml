# On every push to main: rebuild the index from bank/ (committing it if it changed),
# then deploy the practice UI to GitHub Pages (Settings → Pages → Source: GitHub Actions).
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python tools/build.py
      - name: Commit the rebuilt index if bank/ changed it
        run: |
          git add skills/mock-interviewer/data
          if git diff --cached --quiet; then echo "index unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: rebuild question index"
          git push
      - name: Assemble the site
        run: |
          mkdir -p _site/data
          cp -r skills/mock-interviewer/ui/. _site/
          cp skills/mock-interviewer/data/index.json skills/mock-interviewer/data/THIRD_PARTY_LICENSES.md _site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
