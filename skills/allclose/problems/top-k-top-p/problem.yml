num: 8
id: top-k-top-p
title:
  zh: 采样：temperature + top-k + top-p
  en: "Sampling filters: temperature, top-k, top-p"
difficulty: medium
track: llm
topics: [decoding, sampling, top-p, nucleus]
roles: [llm-algorithm]
entry: top_k_top_p
statement:
  zh: |
    实现大模型解码时的采样分布 `top_k_top_p(logits, temperature=1.0, top_k=0, top_p=1.0)`，返回过滤并重新归一化后的概率（不用真的采样）。

    按这个顺序做：
    1. `z = logits / temperature`
    2. `top_k > 0` 时只保留 z 最大的 `top_k` 个，其余设成 -inf（`top_k = 0` 表示不过滤）。
    3. `p = softmax(z)`
    4. `top_p < 1` 时：把 p 从大到小排，**一个 token 保留的条件是排在它前面的 token 概率之和 < top_p**。所以越过阈值的那个 token 也会保留，至少保留 1 个。其余置 0。
    5. 重新归一化，返回和 `logits` 同形状的概率。

    - `logits`：`(V,)` 或 `(B, V)`，最后一维是词表。测试里的 logits 没有并列值。

    **示例**
    ```
    logits = [2.0, 1.0, 0.5, -1.0], top_p = 0.8
    softmax → [0.6095, 0.2242, 0.1360, 0.0303]
    → [0.7311, 0.2689, 0, 0]
    ```
  en: |
    Implement the LLM decoding distribution `top_k_top_p(logits, temperature=1.0, top_k=0, top_p=1.0)` and return
    the filtered, renormalized probabilities (no actual sampling).

    In this order:
    1. `z = logits / temperature`
    2. If `top_k > 0`, keep only the `top_k` largest z and set the rest to -inf (`top_k = 0` means no filter).
    3. `p = softmax(z)`
    4. If `top_p < 1`, sort p in descending order; **a token is kept when the probabilities ranked before it sum
       to < top_p**. So the token that crosses the threshold is kept, and at least one token always survives.
       Zero out the rest.
    5. Renormalize and return probabilities shaped like `logits`.

    - `logits`: `(V,)` or `(B, V)`, vocabulary on the last axis. The tests have no tied logits.

    **Example**
    ```
    logits = [2.0, 1.0, 0.5, -1.0], top_p = 0.8
    softmax → [0.6095, 0.2242, 0.1360, 0.0303]
    → [0.7311, 0.2689, 0, 0]
    ```
hints:
  zh:
    - top-k 的阈值是第 k 大的值：np.sort(z, -1)[..., -k:-k+1] 或 np.partition。
    - top-p：order = np.argsort(-p, -1)，按这个顺序取出概率做 cumsum，“前面之和” = cumsum - 自己。
    - 处理完要把保留标记按 order 放回原来的位置（np.put_along_axis / np.take_along_axis）。
  en:
    - The top-k threshold is the k-th largest value - np.sort(z, -1)[..., -k:-k+1] or np.partition.
    - For top-p, order = np.argsort(-p, -1); cumsum the sorted probs; "sum before it" = cumsum - itself.
    - Scatter the keep-mask back to the original positions (np.put_along_axis / np.take_along_axis).
followups:
  zh:
    - temperature 对分布有什么影响？为什么不建议在 softmax 之后再除温度？
    - top-k 和 top-p 各有什么缺点？min-p 采样是怎么想的？
    - greedy、beam search、采样分别适合什么任务？为什么聊天模型很少用 beam search？
    - 词表 15 万时，这里的排序会不会成为瓶颈？推理框架里怎么优化？
  en:
    - How does temperature reshape the distribution, and why not divide by it after the softmax?
    - What are the weaknesses of top-k and of top-p? What is the idea behind min-p sampling?
    - When do greedy, beam search and sampling fit? Why do chat models rarely use beam search?
    - With a 150k vocabulary, can this sort become a bottleneck? How do inference engines optimize it?
