# 受控标签表 / Controlled vocabulary
#
# companies / roles / types / levels 是封闭集合：题目里用到的值必须先在这里登记（CI 会检查）。
# topics 是开放集合：没登记的 topic 只会给 warning，方便大家先提 PR、再补登记。
#
# 新增公司：按字母序加一行，slug 用小写英文 + 连字符；aliases 写常见叫法（中英文、旧名、子品牌），
# 这样 `bank.py --company 字节` 和 `--company tiktok` 都能命中 bytedance。

companies:
  # —— 中国互联网 / 科技 ——
  alibaba:     { name: 阿里巴巴, en: Alibaba, aliases: [阿里, 淘天, 淘宝, 天猫, 阿里云, aliyun, taobao] }
  ant-group:   { name: 蚂蚁集团, en: Ant Group, aliases: [蚂蚁, 支付宝, alipay, ant] }
  baidu:       { name: 百度, en: Baidu, aliases: [] }
  bilibili:    { name: 哔哩哔哩, en: Bilibili, aliases: [b站, B站] }
  bytedance:   { name: 字节跳动, en: ByteDance, aliases: [字节, 头条, 今日头条, 抖音, tiktok, 飞书, lark, douyin] }
  deepseek:    { name: 深度求索, en: DeepSeek, aliases: [] }
  didi:        { name: 滴滴, en: DiDi, aliases: [滴滴出行] }
  huawei:      { name: 华为, en: Huawei, aliases: [] }
  jd:          { name: 京东, en: JD.com, aliases: [jingdong, jd.com] }
  kuaishou:    { name: 快手, en: Kuaishou, aliases: [kwai] }
  meituan:     { name: 美团, en: Meituan, aliases: [] }
  mihoyo:      { name: 米哈游, en: miHoYo, aliases: [hoyoverse] }
  minimax:     { name: MiniMax, en: MiniMax, aliases: [稀宇] }
  moonshot:    { name: 月之暗面, en: Moonshot AI, aliases: [kimi] }
  netease:     { name: 网易, en: NetEase, aliases: [网易游戏, 网易雷火] }
  pinduoduo:   { name: 拼多多, en: PDD, aliases: [pdd, temu] }
  shein:       { name: 希音, en: SHEIN, aliases: [] }
  shopee:      { name: Shopee, en: Shopee, aliases: [虾皮, sea] }
  tencent:     { name: 腾讯, en: Tencent, aliases: [鹅厂, 微信, wechat, 腾讯游戏, 天美, 光子] }
  xiaohongshu: { name: 小红书, en: Xiaohongshu, aliases: [rednote, 红书] }
  xiaomi:      { name: 小米, en: Xiaomi, aliases: [] }
  zhipu:       { name: 智谱, en: Zhipu AI, aliases: [智谱ai, glm] }
  # —— 海外 ——
  adobe:          { name: Adobe, en: Adobe, aliases: [] }
  airbnb:         { name: Airbnb, en: Airbnb, aliases: [爱彼迎] }
  amazon:         { name: 亚马逊, en: Amazon, aliases: [aws] }
  anthropic:      { name: Anthropic, en: Anthropic, aliases: [] }
  apple:          { name: 苹果, en: Apple, aliases: [] }
  bloomberg:      { name: 彭博, en: Bloomberg, aliases: [] }
  dropbox:        { name: Dropbox, en: Dropbox, aliases: [] }
  google:         { name: 谷歌, en: Google, aliases: [alphabet, deepmind, youtube] }
  hired:          { name: Hired, en: Hired, aliases: [] }
  linkedin:       { name: 领英, en: LinkedIn, aliases: [] }
  lyft:           { name: Lyft, en: Lyft, aliases: [] }
  meta:           { name: Meta, en: Meta, aliases: [facebook, fb, instagram, whatsapp] }
  microsoft:      { name: 微软, en: Microsoft, aliases: [msft, 微软亚研, msra] }
  netflix:        { name: 奈飞, en: Netflix, aliases: [] }
  nvidia:         { name: 英伟达, en: NVIDIA, aliases: [] }
  openai:         { name: OpenAI, en: OpenAI, aliases: [] }
  palantir:       { name: Palantir, en: Palantir, aliases: [] }
  slack:          { name: Slack, en: Slack, aliases: [] }
  snap:           { name: Snap, en: Snap, aliases: [snapchat] }
  stack-overflow: { name: Stack Overflow, en: Stack Overflow, aliases: [stackoverflow] }
  stripe:         { name: Stripe, en: Stripe, aliases: [] }
  twitter:        { name: X / Twitter, en: X (Twitter), aliases: [x] }
  uber:           { name: Uber, en: Uber, aliases: [] }
  yahoo:          { name: 雅虎, en: Yahoo, aliases: [] }
  yelp:           { name: Yelp, en: Yelp, aliases: [] }

# 岗位：parent 表示「也适用于」。按 --role backend 筛选时，也会带上标为 swe 的通用题；
# roles 为空的题（比如行为面）对所有岗位都适用。
roles:
  swe:           { name: 软件开发（通用）, en: Software Engineer, aliases: [开发, 研发, sde, sde-generic] }
  backend:       { name: 后端开发, en: Backend Engineer, parent: swe, aliases: [后端, 服务端, java, go, server] }
  frontend:      { name: 前端开发, en: Frontend Engineer, parent: swe, aliases: [前端, web, fe] }
  fullstack:     { name: 全栈开发, en: Full-stack Engineer, parent: swe, aliases: [全栈] }
  mobile:        { name: 客户端开发, en: Mobile Engineer, parent: swe, aliases: [客户端, 移动端] }
  android:       { name: Android 开发, en: Android Engineer, parent: mobile, aliases: [安卓] }
  ios:           { name: iOS 开发, en: iOS Engineer, parent: mobile, aliases: [] }
  infra:         { name: 基础架构, en: Infrastructure Engineer, parent: swe, aliases: [基础架构, 中间件, platform] }
  game-dev:      { name: 游戏开发, en: Game Developer, parent: swe, aliases: [游戏, 游戏客户端, unity, ue] }
  embedded:      { name: 嵌入式开发, en: Embedded Engineer, parent: swe, aliases: [嵌入式, c++开发] }
  ai-agent:      { name: AI 应用 / Agent 开发, en: AI Application Engineer, parent: swe, aliases: [agent, ai应用, 大模型应用, llm-app] }
  algorithm:     { name: 算法工程师, en: ML / Algorithm Engineer, aliases: [算法, mle, 机器学习] }
  llm-algorithm: { name: 大模型算法, en: LLM Research Engineer, parent: algorithm, aliases: [大模型, llm, 大模型算法岗] }
  rec-sys:       { name: 搜广推算法, en: Recommendation / Ads Engineer, parent: algorithm, aliases: [推荐, 搜广推, 广告算法] }
  cv:            { name: 视觉算法, en: Computer Vision Engineer, parent: algorithm, aliases: [视觉, cv算法] }
  data:          { name: 数据开发 / 数据分析, en: Data Engineer / Analyst, aliases: [数据, 数仓, 数据分析, data-engineer] }
  devops:        { name: 运维 / SRE, en: DevOps / SRE, aliases: [运维, sre] }
  qa:            { name: 测试开发, en: QA / SDET, aliases: [测试, 测开, sdet] }
  security:      { name: 安全工程师, en: Security Engineer, aliases: [安全, 渗透] }
  pm:            { name: 产品经理, en: Product Manager, aliases: [产品] }

