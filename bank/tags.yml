# 受控标签表 / Controlled vocabulary
#
# companies / roles / types / levels 是封闭集合：题目里用到的值必须先在这里登记（CI 会检查）。
# topics 是开放集合：没登记的 topic 只会给 warning，方便大家先提 PR、再补登记。
#
# 新增公司：按字母序加一行，slug 用小写英文 + 连字符；aliases 写常见叫法（中英文、旧名、子品牌），
# 这样 `bank.py --company 字节` 和 `--company tiktok` 都能命中 bytedance。

