# 岗位：parent 表示「也适用于」。按 --role backend 筛选时，也会带上标为 swe 的通用题；
# roles 为空的题（比如行为面）对所有岗位都适用。
roles:
  swe:           { name: 软件开发（通用）, en: Software Engineer, aliases: [开发, 研发, sde, sde-generic] }
  backend:       { name: 后端开发, en: Backend Engineer, parent: swe, aliases: [后端, 服务端, java, go, server] }
  frontend:      { name: 前端开发, en: Frontend Engineer, parent: swe, aliases: [前端, web, fe] }
  fullstack:     { name: 全栈开发, en: Full-stack Engineer, parent: swe, aliases: [全栈] }
  mobile:        { name: 客户端开发, en: Mobile Engineer, parent: swe, aliases: [客户端, 移动端] }
  android:       { name: Android 开发, en: Android Engineer, parent: mobile, aliases: [安卓] }
  ios:           { name: iOS 开发, en: iOS Engineer, parent: mobile, aliases: [] }
  infra:         { name: 基础架构, en: Infrastructure Engineer, parent: swe, aliases: [基础架构, 中间件, platform] }
  game-dev:      { name: 游戏开发, en: Game Developer, parent: swe, aliases: [游戏, 游戏客户端, unity, ue] }
  embedded:      { name: 嵌入式开发, en: Embedded Engineer, parent: swe, aliases: [嵌入式, c++开发] }
  ai-agent:      { name: AI 应用 / Agent 开发, en: AI Application Engineer, parent: swe, aliases: [agent, ai应用, 大模型应用, llm-app] }
  algorithm:     { name: 算法工程师, en: ML / Algorithm Engineer, aliases: [算法, mle, 机器学习] }
  llm-algorithm: { name: 大模型算法, en: LLM Research Engineer, parent: algorithm, aliases: [大模型, llm, 大模型算法岗] }
  rec-sys:       { name: 搜广推算法, en: Recommendation / Ads Engineer, parent: algorithm, aliases: [推荐, 搜广推, 广告算法] }
  cv:            { name: 视觉算法, en: Computer Vision Engineer, parent: algorithm, aliases: [视觉, cv算法] }
  data:          { name: 数据开发 / 数据分析, en: Data Engineer / Analyst, aliases: [数据, 数仓, 数据分析, data-engineer] }
  devops:        { name: 运维 / SRE, en: DevOps / SRE, aliases: [运维, sre] }
  qa:            { name: 测试开发, en: QA / SDET, aliases: [测试, 测开, sdet] }
  security:      { name: 安全工程师, en: Security Engineer, aliases: [安全, 渗透] }
  pm:            { name: 产品经理, en: Product Manager, aliases: [产品] }

